[project]
name = "keboola-mcp-data-app-example"
version = "0.1.0"
description = "Example: host the Keboola MCP Server as a private, single-tenant Keboola data app with bearer + OAuth-shape auth."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Keboola", email = "devel@keboola.com" }]
dependencies = [
    # The upstream Keboola MCP Server. Pin a tag/SHA in production to avoid
    # surprise breakage. Latest stable at scaffold time: v1.61.0.
    "keboola-mcp-server @ git+https://github.com/keboola/keboola-mcp-server.git@v1.61.0",
    # Pulled in transitively by upstream, listed explicitly so editors resolve them.
    "fastmcp>=3.2.0",
    "mcp>=1.27.0",
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.30.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
